name: Convex preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    name: Hosted backend preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      KYB_ALLOW_PREVIEW_BUILD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PREVIEW_NAME: pr-${{ github.event.pull_request.number || github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun run install:ci

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Create and seed Convex preview
        run: >-
          bunx convex deploy
          --preview-create "$PREVIEW_NAME"
          --preview-run seed:prototype
          --cmd "bun scripts/export-preview-url.mjs"
          --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      - name: Test Worker against hosted Convex preview
        run: bun run test:e2e:preview
