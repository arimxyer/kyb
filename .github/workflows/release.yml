name: Release production

run-name: Release ${{ github.sha }} to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "release production" to confirm the protected release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prerequisites:
    name: Confirm release prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      KYB_PRODUCTION_RELEASE_ENABLED: ${{ vars.KYB_PRODUCTION_RELEASE_ENABLED }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require an activated main-branch release
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRMATION" = "release production"
          test "$KYB_PRODUCTION_RELEASE_ENABLED" = "1"

  validation:
    name: Validate exact release commit
    needs: prerequisites
    uses: ./.github/workflows/validate.yml

  release:
    name: Deploy verified production release
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.KYB_PRODUCTION_URL }}
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      KYB_ALLOW_PRODUCTION_DEPLOY: "1"
      KYB_PRODUCTION_ENVIRONMENT_PROTECTED: ${{ vars.KYB_PRODUCTION_ENVIRONMENT_PROTECTED }}
      KYB_PRODUCTION_RELEASE_ENABLED: ${{ vars.KYB_PRODUCTION_RELEASE_ENABLED }}
      KYB_PRODUCTION_URL: ${{ vars.KYB_PRODUCTION_URL }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun run install:ci

      - name: Verify protected release context
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun scripts/production-release-guard.mjs

      - name: Deploy Convex production functions
        run: >-
          bunx convex deploy
          --yes
          --cmd "bun scripts/convex-target-guard.mjs production-ci"
          --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      - name: Build production OpenNext Worker
        run: bun run build:worker:production

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Ensure a safe initial Cloudflare Worker exists
        run: bun scripts/ensure-cloudflare-worker.mjs

      - name: Upload immutable Worker candidate
        id: candidate
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          bunx opennextjs-cloudflare upload -- --tag "$GITHUB_SHA" --message "release-$GITHUB_SHA" --preview-alias candidate --keep-vars
          bun scripts/export-worker-version.mjs

      - name: Verify candidate through Cloudflare
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.candidate.outputs.preview_url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 "$PLAYWRIGHT_BASE_URL" > /dev/null
          bun run test:e2e:remote

      - name: Promote exact candidate version
        run: >-
          bunx wrangler versions deploy
          "${{ steps.candidate.outputs.version_id }}@100%"
          --yes
          --message "release-$GITHUB_SHA"

      - name: Verify promoted production URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.KYB_PRODUCTION_URL }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 "$PLAYWRIGHT_BASE_URL" > /dev/null
          bun run test:e2e:remote

      - name: Record release receipt
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.preview_url }}
          VERSION_ID: ${{ steps.candidate.outputs.version_id }}
        run: |
          {
            echo "### Production release"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Convex: \`$NEXT_PUBLIC_CONVEX_URL\`"
            echo "- Worker version: \`$VERSION_ID\`"
            echo "- Candidate: $CANDIDATE_URL"
            echo "- Production: $KYB_PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
